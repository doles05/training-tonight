<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Training Tonight</title>
<style>
/* =========================================================
   STYLES
   Palette: navy kit, chalk-white paper, pitch green,
   bib yellow for the main action, cone orange for numbers.
   ========================================================= */
:root{
  --ink:#14213D; --ink2:#4A5870; --paper:#F1F4EC; --card:#FFFFFF; --line:#D8E0CF;
  --pitch:#2E8B4F; --pitch2:#226B3C; --bib:#FFD23F; --cone:#FF7A1A; --sky:#1E6FD9;
  --warn:#FFF3C4; --warnline:#E8C64A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.5 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4{line-height:1.15;margin:0}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
.brand{background:none;border:0;padding:4px 0;color:#fff;font-weight:900;font-size:18px;letter-spacing:-.02em;white-space:nowrap;
  display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav button{background:rgba(255,255,255,.1);border:0;border-radius:999px;color:#fff;padding:7px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.top nav button[aria-current="page"]{background:var(--bib);color:var(--ink)}
.top nav button:disabled{opacity:.35;cursor:default}

main{max-width:680px;margin:0 auto;padding:18px 16px 60px}

/* ---------- setup ---------- */
.hero{padding:6px 0 18px}
.hero h1{font-size:34px;font-weight:900;letter-spacing:-.035em}
.hero p{margin:8px 0 0;color:var(--ink2);max-width:34em}
.field{padding:16px 0;border-top:1px solid var(--line)}
.field-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.field-head h2{font-size:19px;font-weight:800}
.field-head .hint{color:var(--ink2);font-size:14px}
.field-head .chip{margin-left:auto}
.range{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.range .to{color:var(--ink2);font-weight:700}
.stepper{display:inline-flex;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--paper);font-size:26px;font-weight:700;line-height:1;
  display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stepper button:active{background:var(--bib)}
.stepper .num-in{width:62px;height:46px;border:0;border-radius:10px;background:transparent;text-align:center;color:var(--ink);
  font-family:inherit;font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;padding:0}
.stepper .num-in:focus{background:#FFF6CF;outline:2px solid var(--bib)}
.stepper .num-in::placeholder{font-size:15px;font-weight:700;color:var(--ink2)}
.is-unknown .stepper{opacity:.38}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-weight:700;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.small{min-height:36px;padding:5px 12px;font-size:14px}
.chips.big .chip{font-size:20px;font-weight:900;padding:10px 20px;font-variant-numeric:tabular-nums}
.go{display:block;width:100%;margin:22px 0 6px;min-height:64px;border:0;border-radius:16px;background:var(--bib);color:var(--ink);
  font-size:22px;font-weight:900;letter-spacing:-.01em;box-shadow:0 3px 0 #C9A21A}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #C9A21A}
.small-note{color:var(--ink2);font-size:14px;margin:6px 0 0}

/* ---------- plan overview ---------- */
.plan-top h1{font-size:30px;font-weight:900;letter-spacing:-.03em}
.plan-top .sum{margin:6px 0 0;color:var(--ink2);font-size:16px}
.notes{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{background:var(--warn);border-left:5px solid var(--warnline);border-radius:8px;padding:9px 12px;font-size:15px}
.strip{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:18px 0 6px;background:var(--pitch2)}
.strip span{display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;
  border-right:2px solid var(--paper);min-width:0;overflow:hidden;white-space:nowrap}
.strip span:last-child{border-right:0}
.strip .a{background:#6E7F99}.strip .w{background:#C99A06}.strip .s{background:var(--pitch)}.strip .g{background:var(--ink)}
.order{list-style:none;margin:12px 0 0;padding:0}
.order a{display:grid;grid-template-columns:78px 34px 1fr;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none}
.order .t{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700;font-size:15px}
.order .n{font-weight:900;color:var(--cone);font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.order .what{font-weight:700}
.order .what small{display:block;font-weight:500;color:var(--ink2);font-size:14px}
.panel{margin-top:22px}
.panel h2{font-size:20px;font-weight:900;margin-bottom:8px}
.panel p{margin:0 0 8px;color:var(--ink2);font-size:15px}
.rota{width:100%;border-collapse:separate;border-spacing:4px;font-size:14px;table-layout:fixed}
.rota th{text-align:left;font-weight:800;vertical-align:bottom;padding:2px 4px;font-size:13px;line-height:1.25}
.rota th small{display:block;color:var(--ink2);font-weight:600}
.rota td{border-radius:8px;padding:8px 4px;text-align:center;font-weight:800;color:#fff}
.rota td.time{background:none;color:var(--ink2);text-align:left;font-variant-numeric:tabular-nums;font-weight:700}
.rota-wrap{overflow-x:auto}
.kit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kit div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.kit b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.kit span{font-size:14px;color:var(--ink2);font-weight:700}
.kit small{display:block;font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.3}

/* ---------- drill cards ---------- */
.drills{margin-top:28px;display:grid;gap:22px}
.drill{background:var(--card);border-radius:20px;padding:16px 16px 18px;border-top:7px solid var(--pitch);
  box-shadow:0 1px 0 var(--line)}
.drill.role-a{border-top-color:#6E7F99}.drill.role-w{border-top-color:#E0AE0B}.drill.role-g{border-top-color:var(--ink)}
.drill-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.num{font-size:44px;font-weight:900;line-height:.9;color:var(--cone);font-variant-numeric:tabular-nums;letter-spacing:-.04em;min-width:34px}
.drill-head h3{font-size:23px;font-weight:900;letter-spacing:-.02em}
.drill-head .meta{margin:4px 0 0;color:var(--ink2);font-size:15px;line-height:1.35}
.drill-head .meta b{color:var(--ink)}
.star{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.star svg{width:24px;height:24px;fill:none;stroke:var(--ink2);stroke-width:2}
.star[aria-pressed="true"]{background:var(--bib);border-color:var(--bib)}
.star[aria-pressed="true"] svg{fill:var(--ink);stroke:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tags span{font-size:13px;font-weight:700;background:var(--paper);border-radius:999px;padding:3px 10px;color:var(--ink2)}
.tags span.hit{background:#DDF3E3;color:#14532D}
.anim{position:relative;margin:14px -4px 0;border-radius:14px;overflow:hidden;background:var(--pitch);aspect-ratio:100/64}
.anim svg{display:block;width:100%;height:100%}
.anim .playbtn{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;border:0;
  background:rgba(20,33,61,.82);color:#fff;display:grid;place-items:center}
.anim .playbtn svg{width:20px;height:20px;fill:#fff}
.anim.broken::after{content:"Animation unavailable";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700}
.sect{margin-top:16px}
.sect h4{font-size:15px;font-weight:900;color:var(--pitch2);margin-bottom:6px}
.sect ol,.sect ul{margin:0;padding-left:22px}
.sect li{margin:4px 0}
.sect p{margin:0}
.sect ol li::marker{font-weight:900;color:var(--cone)}
.tweak{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tweak div{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:15px}
.tweak b{display:block;font-size:14px;margin-bottom:2px}
.explain{margin-top:14px;width:100%;min-height:50px;border-radius:14px;border:2px dashed var(--sky);background:#EEF4FD;color:#0F4FA8;
  font-weight:800;font-size:16px}
.explain[aria-expanded="true"]{border-style:solid}
.walk{margin-top:10px;background:#EEF4FD;border-radius:14px;padding:12px 14px 12px}
.walk h4{font-size:15px;font-weight:900;color:#0F4FA8;margin-bottom:6px}
.walk ol{margin:0;padding-left:22px}.walk li{margin:7px 0;font-size:17px}
.walk li::marker{font-weight:900;color:#0F4FA8}
.walk .slow{margin:8px 0 0;font-size:13px;color:var(--ink2)}
.bibrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bibrow b{min-width:58px}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid rgba(0,0,0,.15)}
.bibadd{align-items:center}.bibadd .hint{color:var(--ink2);font-size:14px;margin-right:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
.swap{margin-top:16px;width:100%;min-height:52px;border-radius:14px;border:2px solid var(--ink);background:var(--card);
  font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.swap svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4}
.swap:active{background:var(--bib)}
.back{background:none;border:0;color:var(--sky);font-weight:800;padding:8px 0;font-size:16px}
.empty{padding:30px 0;color:var(--ink2)}
.empty h2{color:var(--ink);font-size:22px;margin-bottom:6px}
.flash{animation:flash .9s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px var(--bib)}to{box-shadow:0 1px 0 var(--line)}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;max-width:90vw;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
.share-row{display:flex;gap:8px;margin-top:14px}
.share-row .wa{flex:1;min-height:52px;border:0;border-radius:14px;background:#25D366;color:#0B3D20;font-weight:900;font-size:17px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.share-row .wa svg{width:22px;height:22px}
.share-row .copy{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-weight:800}
.chip.squad-Reds[aria-pressed="true"]{background:#E63946;border-color:#E63946}
.chip.squad-Greens[aria-pressed="true"]{background:#12A150;border-color:#12A150}
#mdPaste{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;background:var(--card);resize:vertical}
.kids{display:grid;gap:8px;margin-top:6px}
.kid{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.kid.unk{border-style:dashed}
.kname{font-weight:800}
.kdel{grid-column:2;grid-row:1;width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);font-size:20px;font-weight:700}
.seg{grid-column:1 / span 2;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{min-height:40px;border-radius:9px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button[data-av="out"][aria-pressed="true"]{background:#8A94A6;border-color:#8A94A6}
.addkid{display:flex;gap:8px;margin-top:10px}
.addkid input{flex:1;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px}
.md-set{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.md-set b{display:block;font-size:14px;margin-bottom:4px}
.mini{display:flex;align-items:center;gap:6px}
.mini button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:800}
.mini span{min-width:56px;text-align:center;font-weight:900}
.gt{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}
.gt th:first-child,.gt td.nm{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt th{font-size:12px;text-align:center;padding:4px 2px;color:var(--ink2)}
.gt th:first-child{text-align:left}
.gt td{text-align:center;padding:7px 2px;border-top:1px solid var(--line);font-weight:800}
.gt td.nm{text-align:left;font-weight:700}
.gt td.on{color:var(--pitch2)}.gt td.gk{color:var(--cone)}.gt td.sub{color:var(--ink2);font-weight:600;font-size:13px}
.gt td.na{color:#B8C0CC}.gt td.mins{font-variant-numeric:tabular-nums}
@media (max-width:440px){ .brand-name{display:none} }
@media (max-width:420px){
  .hero h1{font-size:29px}
  .tweak{grid-template-columns:1fr}
  .order a{grid-template-columns:66px 28px 1fr}
  .stepper button{width:42px;height:42px}
  .stepper .num-in{width:52px}
}
@media (prefers-reduced-motion:reduce){ .flash{animation:none} }
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="Back to setup">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 20h16z" fill="#FF7A1A"/><path d="M8.2 12.5h7.6" stroke="#fff" stroke-width="1.6"/></svg>
    <span class="brand-name">Training Tonight</span>
  </button>
  <nav>
    <button data-go="setup" aria-current="page">Setup</button>
    <button data-go="plan" disabled>Plan</button>
    <button data-go="match">Match</button>
    <button data-go="favs" aria-label="Favourites">&#9733; <span id="favCount">0</span></button>
  </nav>
</header>
<main>
  <section id="view-setup"></section>
  <section id="view-plan" hidden></section>
  <section id="view-match" hidden></section>
  <section id="view-favs" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =========================================================
   1. ANIMATION ENGINE
   Every drill describes its animation with a small builder:
     A(seconds).area(x,y,w,h).cones('x,y x,y').p(colour, keys, label, name).b(keys)
   The pitch is 100 wide x 64 high, seen from above.
   Keys are written as text:  "0:10,20 .5:40,20"  = at the start at (10,20),
   half-way through the loop at (40,20).  A ball key "t@name" means the ball
   is at that player's feet, so "0@a .4@a .5@b" = a dribbles, then passes to b.
   Add ^ to a ball key to show the ball in the air on the way there.
   Tracks loop back to their first key at the end unless they finish at 1.
   Colours: r red, b blue, y yellow, g green, p purple, k coach (navy).
   ========================================================= */
const PCOL = { r:'#E63946', b:'#1E6FD9', y:'#FFC300', g:'#12A150', p:'#8B5CF6', k:'#14213D', o:'#FF7A1A' };
const CCOL = { o:'#FF8A1F', y:'#FFE14D', b:'#4CC9F0', r:'#FF4D6D', g:'#B7F171', w:'#FFFFFF', p:'#D7A6FF' };
const r1 = v => Math.round(v * 10) / 10;
const K = (t, x, y) => `${+t.toFixed(3)}:${r1(x)},${r1(y)}`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = t => ((t % 1) + 1) % 1;

/* Seeded random numbers, so the same drill always animates the same way */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function parseKeys(s) {
  return s.trim().split(/\s+/).map(tok => {
    let m = tok.match(/^([\d.]+)@(\w+)(\^?)$/);
    if (m) return { t: +m[1], who: m[2], air: !!m[3] };
    m = tok.match(/^([\d.]+):(-?[\d.]+),(-?[\d.]+)(\^?)$/);
    if (m) return { t: +m[1], x: +m[2], y: +m[3], air: !!m[4] };
    throw new Error('Bad animation key "' + tok + '"');
  });
}
function sampleFn(fn, n = 120) {
  const out = [];
  for (let i = 0; i <= n; i++) { const t = i / n, [x, y] = fn(t); out.push({ t, x, y }); }
  return out;
}

class Anim {
  constructor(dur = 7) { Object.assign(this, { dur, areas: [], cs: [], gs: [], zs: [], ls: [], ps: [], bs: [], ts: [], names: {} }); }
  area(x, y, w, h) { this.areas.push([x, y, w, h]); return this; }
  cone(x, y, c = 'o') { this.cs.push([x, y, c]); return this; }
  cones(str, c = 'o') { str.trim().split(/\s+/).forEach(p => { const [x, y] = p.split(',').map(Number); this.cone(x, y, c); }); return this; }
  corners(x, y, w, h, c = 'o') { return this.cone(x, y, c).cone(x + w, y, c).cone(x, y + h, c).cone(x + w, y + h, c); }
  gate(x, y, vertical = true, w = 5, c = 'y') { return vertical ? this.cone(x, y - w / 2, c).cone(x, y + w / 2, c) : this.cone(x - w / 2, y, c).cone(x + w / 2, y, c); }
  goal(x, y, side = 'R', w = 9) { this.gs.push([x, y, side, w]); return this; }
  zone(x, y, w, h, col = 'rgba(255,255,255,.13)', label = '') { this.zs.push([x, y, w, h, col, label]); return this; }
  line(x1, y1, x2, y2) { this.ls.push([x1, y1, x2, y2]); return this; }
  /* player: colour, keys (string or function t→[x,y]), label, name */
  p(c, keys, label = '', name) {
    const fn = typeof keys === 'function';
    this.ps.push({ c, l: label, k: fn ? sampleFn(keys) : parseKeys(keys), lin: fn, ph: 0 });
    if (name) this.names[name] = this.ps.length - 1;
    return this;
  }
  /* which way the last player faces when standing still (fixed = always) */
  face(dx, dy, fixed = false) { const p = this.ps[this.ps.length - 1]; p.face = [dx, dy]; p.ff = fixed; return this; }
  /* change the last player's colour (and label) during the loop: [[t, colour, label], ...] */
  col(steps) { this.ps[this.ps.length - 1].cols = steps; return this; }
  /* start the last player part-way through the loop (0–1) */
  ph(v) { this.ps[this.ps.length - 1].ph = v; return this; }
  b(keys, ph = 0) {
    const fn = typeof keys === 'function';
    this.bs.push({ k: fn ? sampleFn(keys) : parseKeys(keys), lin: fn, ph });
    return this;
  }
  text(x, y, steps, size = 3.6) { this.ts.push({ x, y, steps: typeof steps === 'string' ? [[0, steps]] : steps, size }); return this; }

  /* A crowd of players moving around a box (dribbling unless ball:false).
     freeze:[[t0,t1]] everyone stops, slow:[[t0,t1]] tiny touches only */
  crowd(o) {
    const r = rng(o.seed || 5), [bx, by, bw, bh] = o.box, steps = o.steps || 6, fr = o.freeze || [], sl = o.slow || [];
    const cx = v => clamp(v, bx + 3, bx + bw - 3), cy = v => clamp(v, by + 3, by + bh - 3);
    for (let i = 0; i < o.n; i++) {
      let times = [];
      const bounds = fr.concat(sl).flat();
      for (let s = 0; s <= steps; s++) { const t = s / steps; if (t === 0 || t === 1 || !bounds.some(b => Math.abs(b - t) < .05)) times.push(t); }
      fr.concat(sl).forEach(w => times.push(w[0], w[1]));
      times = [...new Set(times.map(t => +t.toFixed(3)))].sort((a, b) => a - b)
        .filter(t => !fr.some(w => t > w[0] && t < w[1]));
      let first = null, prev = null; const keys = [];

  how: 'The coach calls moves: toe taps, sole rolls, pull-backs, step-overs. Only do it if the coach says "Simon says" first!',
  pts: ['On your toes, light touches', 'Use both feet', 'Eyes up to watch the coach'],
  easy: 'Drop the trick; everyone just copies the coach.', hard: 'Put two moves together, e.g. sole roll then pull-back.',
  anim: () => {
    const a = A(9).area(25, 12, 50, 40).corners(25, 12, 50, 40);
    [[35, 22], [50, 22], [65, 22], [35, 36], [50, 36], [65, 36]].forEach(([x, y], i) => {
      a.p('r', t => {
        if (t < .33) return [x, y + Math.sin(t * 60) * .25];
        if (t < .66 || (i === 4 && t < .85)) return [x + Math.sin((t - .33) * Math.PI * 8) * 3, y];
        return [x, y];
      }, '', 'p' + i).face(0, 1, true).b(`0@p${i} 1@p${i}`);
    });
    return a.p('k', '0:50,57 1:50,57', 'C').text(50, 8.5, [[0, 'Simon says toe taps!'], [.33, 'Simon says sole rolls!'], [.66, 'Stop! (no "Simon says")', '#FFC300'], [.86, 'Caught one! Do 3 toe taps', '#FFC300']]);
  }
});

D({ id: 'safari', name: 'Movement Safari', role: 'w', focus: ['agility', 'speed'], int: 2, dur: [4, 7], min: 4, max: 24, ball: 0,
  setup: ['Put 2 lines of cones about 15 big steps apart.', 'Everyone lines up along one line, spread out with space to move.'],
  how: 'Coach calls an animal and everyone crosses the box moving like it: bear crawl, frog jumps, zig-zag skips, crab walk. Race back with fast feet.',
  pts: ['Small, quick steps on your toes', 'Arms help you balance', 'Bend your knees when you land'],
  easy: 'Shorter distance; walk the hard ones.', hard: 'Add a ball: dribble back after each animal.',
  anim: () => {
    const a = A(9).area(15, 8, 70, 48).cones('18,8 18,56 50,8 50,56 82,8 82,56', 'y');
    for (let i = 0; i < 5; i++) {
      const y = 15 + i * 8.5;
      a.p(i % 2 ? 'b' : 'r', t => {
        if (t < .33) return [20 + 30 * (t / .33), y];
        if (t < .66) { const k = ((t - .33) / .33) * 5, f = Math.floor(k), fr = k - f; return [50 + 30 * ((f + (fr < .55 ? 0 : (fr - .55) / .45)) / 5), y]; }
        const u = (t - .66) / .34; return [80 - 60 * u, y + Math.sin(u * Math.PI * 6) * 3];
      });
    }
    return a.text(50, 5.5, [[0, 'Bear crawl'], [.33, 'Frog jumps'], [.66, 'Zig-zag skips back']]);
  }
});

/* pass-and-follow round a shape: players all look alike, so the loop is seamless */
function passFollow(a, pts, col) {
  const n = pts.length, step = 1 / n;
  const bk = [];
  pts.forEach((p, i) => {
    const nx = pts[(i + 1) % n], tp = i * step;
    a.p(col, `0:${p[0]},${p[1]} ${K(tp + .02, ...p)} ${K(tp + step * .8, ...nx)} ${K(1, ...nx)}`, '', 'q' + i);
  });
  for (let i = 0; i < n; i++) {
    const tp = i * step;
    if (i === 0) bk.push('0@q0', `${(tp + .02).toFixed(3)}@q0`);
    else bk.push(`${(tp - step + .1).toFixed(3)}@q${i}`, `${(tp + .02).toFixed(3)}@q${i}`);
  }
  bk.push(K(1 - step + .1, pts[0][0] + 2, pts[0][1]));
  bk.push(K(.999, pts[0][0] + 2, pts[0][1]));
  return a.b(bk.join(' '));
}

D({ id: 'shield', name: 'Shield the Treasure', role: 's w', focus: ['possession', 'dribbling', 'defending'], int: 2, dur: [5, 9], min: 4, max: 14, ball: 'half', cones: [6, 0], bibs: 'few',
  setup: ['Mark a circle of cones about 15 big steps across.', 'Half the players have a ball ("treasure"); the other half are pirates (bibs).'],
  how: 'Pirates try to steal a ball. Keep your body between the pirate and your ball. Lose it? You become a pirate. 1-minute rounds, then swap.',
  pts: ['Sideways on, arm out (no pushing)', 'Ball on the foot furthest from the pirate', 'Little touches, keep turning away'],
  easy: 'Pirates can only steal with their weaker foot.', hard: 'Shielders must also dribble to touch a cone.',
  anim: () => {
    const a = A(8);
    for (let i = 0; i < 10; i++) { const g = i / 10 * Math.PI * 2; a.cone(50 + 34 * Math.cos(g), 32 + 26 * Math.sin(g), 'y'); }
    [[36, 22, 0], [62, 24, 2], [48, 44, 4]].forEach(([cx, cy, ph], i) => {
      const me = t => [cx + 3 * Math.sin(2 * Math.PI * t + ph), cy + 3 * Math.cos(2 * Math.PI * t + ph)];
      const pir = t => { const g = 2 * Math.PI * 2 * t + ph, m = me(t); return [m[0] + 6 * Math.cos(g), m[1] + 6 * Math.sin(g)]; };
      a.p('r', me).p('y', pir, 'P');
      a.b(t => { const m = me(t), p = pir(t), dx = m[0] - p[0], dy = m[1] - p[1], L = Math.hypot(dx, dy) || 1; return [m[0] + 2.8 * dx / L, m[1] + 2.8 * dy / L]; });

    return a.text(50, 4, 'Body between the pirate and your ball', 3.2);
  }
});

  keepyup: ['Everyone who arrives takes a ball and finds a space.', 'Level 1: drop the ball, kick it up once with your laces, catch it.', 'Level 2: two kicks, then catch. Level 3: one bounce allowed between kicks.', 'Players shout their best score to the coach and try to beat it next week.']
};
DRILLS.forEach(d => { d.walk = WALK[d.id] || []; });

/* =========================================================
   3. FAVOURITES (saved on this phone with localStorage)
   ========================================================= */
const FAV_KEY = 'trainingTonight.favourites.v1';
let FAV = new Set();
try { FAV = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch (e) { FAV = new Set(); }
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify([...FAV])); } catch (e) { /* storage blocked: favourites last this visit only */ } }
const byId = Object.fromEntries(DRILLS.map(d => [d.id, d]));

/* =========================================================
   4. SESSION SETUP STATE
   ========================================================= */
const S = {
  players: { min: 35, max: 40, unknown: false },
  coaches: { min: 3, max: 4, unknown: false },
  balls: null,                 // null = not set (assume one each)
  bibSets: [],                 // [{ c: 'Yellow', n: 10 }, ...] up to 4 sets
  pitches: 2,                  // large caged pitches (8v8 size)
  length: 60, arrival: 10, squads: false, focus: [], favFirst: true
};
let PLAN = null, LAYOUT = { at: {}, notes: [] };
const BIB_COLOURS = [['Yellow', '#FFD23F'], ['Orange', '#FF7A1A'], ['Blue', '#1E6FD9'], ['Green', '#12A150'],
  ['Red', '#E63946'], ['Pink', '#E84393'], ['White', '#F4F4F4'], ['Black', '#222222']];
const bibHex = c => (BIB_COLOURS.find(b => b[0] === c) || ['', '#888'])[1];
const lightBib = c => c === 'Yellow' || c === 'White';
/* station groups are lettered (not red/green, so they never clash with the weekend squads) */
const GROUP_FALLBACK = ['#1E6FD9', '#D99A00', '#8B5CF6', '#F26B0F', '#D6336C', '#0E9AA7', '#6B7280', '#7C4A1E'];
function groupList(k, st, P) {
  const sets = st.bibSets;
  if (sets.length >= k) {
    const size = Math.ceil(P / k);
    return sets.slice(0, k).map(s => ({ name: s.c + 's', hex: bibHex(s.c), dark: lightBib(s.c), bibs: s.n >= size }));
  }
  return Array.from({ length: k }, (_, i) => ({ name: 'Group ' + 'ABCDEFGH'[i], hex: GROUP_FALLBACK[i], dark: false, bibs: false }));
}

/* =========================================================
   5. PLAN GENERATION
   Shape of every session:
     warm-up (everyone) → station blocks (groups rotate, cones stay put) → final game
   One station per coach (at most one at each end of each pitch); every group visits every station.
   ========================================================= */

/* What a drill needs for n players: areas side by side, balls, cones, bibs */
function needs(d, n, minAreas = 1) {
  const areas = Math.max(minAreas, Math.ceil(n / d.max)), per = n / areas, b = d.ball;
  const balls = b === 'each' ? n : b === 'half' ? Math.ceil(n / 2) : b === 'third' ? Math.ceil(n / 3) : (b || 0) * areas;
  const cones = areas * d.cones[0] + Math.ceil(d.cones[1] * n);
  const bibs = d.bibs === 'team' ? Math.floor(n / 2) : d.bibs === 'few' ? areas * Math.max(1, Math.round(per / 5)) : 0;
  return { areas, per, balls, cones, bibs, ok: n >= d.min && per >= d.min };
}

/* Numbers for the plan: the middle of each range, sensible defaults when blank */
function readNumbers(st) {
  const notes = [];
  const pu = st.players.unknown, cu = st.coaches.unknown;
  const P = pu ? 14 : Math.round((st.players.min + st.players.max) / 2);
  const Plo = pu ? 10 : st.players.min, Phi = pu ? 18 : st.players.max;
  const C = Math.max(1, cu ? 2 : st.coaches.min);   // plan for the coaches you're sure of
  if (pu) notes.push('Player numbers not set: planned for about 14, and every drill works from 10 to 18.');
  if (cu) notes.push('Coach numbers not set: planned for 2 coaches.');
  const balls = st.balls == null ? P : st.balls;
  if (st.balls == null) notes.push(`Balls not set, so the plan assumes one each (${P}).`);
  else if (st.balls < P) notes.push(`${st.balls} balls for about ${P} players, so the plan favours drills where players share.`);
  const bibs = st.bibSets.reduce((a, s) => a + s.n, 0);
  return { notes, P, Plo, Phi, C, balls, bibs, cones: null };
}

/* Minutes for the warm-up (W), each station round (R) and the final game (G) */
function timing(T, D, notes, arrivals) {
  let W = arrivals ? 0 : clamp(Math.round(T * .15), 6, 12), G = clamp(Math.round(T * .25), 10, 25), M = Math.max(1, D - 2);
  const middle = T - W - G;
  while (M > 1 && middle / M < 6) M--;
  if (M < D - 2) notes.push(`${D - 2} stations won't fit into ${T} minutes without rushing, so the plan has ${M}. Spare coaches can help at the busiest station.`);
  let R = Math.floor(middle / M), spare = middle - R * M;
  if (R > 15) { spare += (R - 15) * M; R = 15; }
  let add = Math.min(spare, Math.max(0, 30 - G)); G += add; spare -= add;
  if (!arrivals) { add = Math.min(spare, Math.max(0, 15 - W)); W += add; spare -= add; }
  if (spare > 0) { R += Math.floor(spare / M); G += spare % M; }
  if (R > 15 || G > 25) notes.push(`With ${M === 1 ? 'one station' : M + ' stations'} in ${T} minutes each turn runs long. Another coach means another station and shorter turns.`);
  return { W, G, M, R };
}

/* Split M station drills into blocks of at most `cap` stations */
function splitBlocks(M, cap) {
  const nb = Math.ceil(M / cap), base = Math.floor(M / nb), extra = M % nb;
  return Array.from({ length: nb }, (_, i) => base + (i < extra ? 1 : 0));
}

/* Choose the best drill for a slot.
   o: role, n, lo, hi, mins, ballsLeft, cones, bibs, exclude, uncovered, usedPrimary, like (drill to stay similar to), rand, strict */
function pickDrill(o) {
  const tiers = [[], [], [], []];   // 0 fits everything, 1 short of cones, 2 short of balls, 3 group-size mismatch
  for (const d of DRILLS) {
    if (!d.role.includes(o.role) || o.exclude.has(d.id)) continue;
    const nd = needs(d, o.n, o.minAreas || 1);
    if (d.bibReq && (o.bibs == null || nd.bibs > o.bibs)) continue;
    let tier = 0;
    if (!nd.ok) tier = 3;
    else if (o.ballsLeft != null && nd.balls > o.ballsLeft) tier = 2;
    else if (o.cones != null && nd.cones > o.cones) tier = 1;
    tiers[tier].push({ d, nd, s: scoreDrill(d, nd, o) });
  }
  const last = o.strict ? 2 : 3;
  for (let t = 0; t <= last; t++) {
    if (!tiers[t].length) continue;
    tiers[t].sort((a, b) => b.s - a.s);
    return Object.assign(tiers[t][0], { relaxed: ['', 'cones', 'balls', 'size'][t] });
  }
  return null;
}
function scoreDrill(d, nd, o) {
  let s = o.rand() * 1.2;
  const focus = S.focus;
  const hits = focus.length ? d.focus.filter(f => focus.includes(f)).length : 0;
  if (hits) s += 2 + hits * .6;
  if (o.uncovered && d.focus.some(f => o.uncovered.has(f))) s += 2.5;
  if (S.favFirst && FAV.has(d.id)) s += 2.2;
  if (o.mins < d.dur[0]) s -= (d.dur[0] - o.mins) * .5;
  if (o.mins > d.dur[1]) s -= (o.mins - d.dur[1]) * .35;
  const robust = [o.lo, o.hi].every(m => m >= d.min && m / Math.max(1, Math.ceil(m / d.max)) >= d.min);
  if (robust) s += .6;
  if (nd.cones > 16) s -= .7;
  if (o.usedPrimary && o.usedPrimary.has(d.focus[0])) s -= .8;
  if (d.role[0] !== o.role) s -= o.role === 'g' ? 1 : .3;
  if (o.role === 'w' && d.int === 3) s -= .2;
  if (o.like) {
    s += d.focus.filter(f => o.like.focus.includes(f)).length * 1.2;
    s -= Math.abs(d.int - o.like.int) * .5;
  }
  return s;
}

function buildPlan(st, seed) {
  const rand = rng(seed == null ? (Math.random() * 4294967295) >>> 0 : seed);
  const N = readNumbers(st), notes = N.notes, AR = st.arrival || 0;
  const stations = Math.max(1, Math.min(N.C, 2 * (st.pitches || 2), Math.floor(N.P / 3)));   // one per coach, one per pitch end
  const tm = timing(st.length - AR, stations + 2, notes, AR > 0);
  const uncovered = new Set(st.focus), used = new Set(), usedPrimary = new Set(), relaxed = new Set();
  const slots = [], blocks = [], phases = [];
  const take = (role, n, lo, hi, mins, ballsLeft, minAreas) => {
    const base = { role, n, lo, hi, mins, ballsLeft, cones: null, bibs: N.bibs, uncovered, usedPrimary, rand, minAreas };
    let r = pickDrill(Object.assign({ exclude: used }, base));
    if (!r) r = pickDrill(Object.assign({ exclude: new Set() }, base));     // whole catalogue used: allow a repeat
    used.add(r.d.id); usedPrimary.add(r.d.focus[0]); r.d.focus.forEach(f => uncovered.delete(f));
    if (r.relaxed && role !== 'a') relaxed.add(r.relaxed);
    return r;
  };
  let t = 0;
  if (AR) {
    const minA = st.squads ? 2 : 1;
    const a = take('a', N.P, N.Plo, N.Phi, AR, N.balls, minA);
    phases.push([slots.length]);
    slots.push({ role: 'a', d: a.d, nd: a.nd, n: N.P, lo: N.Plo, hi: N.Phi, mins: AR, start: 0, end: AR, block: -1, minAreas: minA });
    t = AR;
  }
  if (!AR) {                                  // no arrivals opener: a normal warm-up instead
    const w = take('w', N.P, N.Plo, N.Phi, tm.W, N.balls);
    phases.push([slots.length]);
    slots.push({ role: 'w', d: w.d, nd: w.nd, n: N.P, lo: N.Plo, hi: N.Phi, mins: tm.W, start: t, end: t + tm.W, block: -1 });
    t += tm.W;
  }
  const cap = Math.max(1, Math.min(N.C, Math.floor(N.P / 3)));
  splitBlocks(tm.M, cap).forEach((k, bi) => {
    const n = Math.ceil(N.P / k), lo = Math.floor(N.Plo / k), hi = Math.ceil(N.Phi / k);
    const blk = { k, R: tm.R, start: t, end: t + k * tm.R, group: N.P / k, slots: [] };
    let left = N.balls;
    const picks = [];
    for (let s = 0; s < k; s++) {
      const r = take('s', n, lo, hi, tm.R, Math.max(0, left));
      left -= r.nd.balls;
      picks.push(r);
    }
    /* smallest set-ups first: with an odd number of stations the biggest one gets a pitch to itself */
    picks.sort((a, b) => a.nd.areas - b.nd.areas).forEach((r, s) => {
      blk.slots.push(slots.length);
      slots.push({ role: 's', d: r.d, nd: r.nd, n, lo, hi, mins: tm.R, start: t, end: blk.end, block: bi, station: s, k });
    });
    blocks.push(blk); phases.push(blk.slots.slice());
    t = blk.end;
  });
  const g = take('g', N.P, N.Plo, N.Phi, tm.G, N.balls);
  phases.push([slots.length]);
  slots.push({ role: 'g', d: g.d, nd: g.nd, n: N.P, lo: N.Plo, hi: N.Phi, mins: tm.G, start: t, end: t + tm.G, block: -1 });

  if (relaxed.has('balls')) notes.push(`Some drills need more balls than you have (${N.balls}), so players share where needed.`);
  if (relaxed.has('size')) notes.push('With these numbers some drills run with smaller groups than ideal; a coach can join in to make up numbers.');
  if (uncovered.size) {
    const names = [...uncovered].map(f => FOCUS_LABEL[f].toLowerCase());
    notes.push(st.focus.length > slots.length
      ? `More focus areas than activities tonight, so ${joinList(names)} will have to wait for another session.`
      : `No ${joinList(names, 'or')} drill fits tonight's numbers, kit and time, so other drills fill those slots.`);
  }
  const plan = { st: JSON.parse(JSON.stringify(st)), N, tm, slots, blocks, phases, notes };
  addKitNotes(plan);
  return plan;
}

/* Kit for the evening: balls/bibs = the most used at once; cones = everything set out before kick-off */
function kitTotals(plan) {
  const sum = (idx, k) => idx.reduce((a, i) => a + plan.slots[i].nd[k], 0);
  return {
    balls: Math.max(...plan.phases.map(ph => sum(ph, 'balls'))),
    bibs: Math.max(...plan.phases.map(ph => sum(ph, 'bibs'))),
    cones: plan.phases.reduce((a, ph) => a + sum(ph, 'cones'), 0)
  };
}
function addKitNotes(plan) {
  plan.notes = plan.notes.filter(n => !n.startsWith('No bibs') && !n.startsWith('Tonight needs up to'));
  const kit = kitTotals(plan), have = plan.N.bibs;
  if (kit.bibs && !have) plan.notes.push('No bibs entered: each set-up says how to tell teams apart without them.');
  else if (kit.bibs > have) plan.notes.push(`Tonight needs up to ${kit.bibs} bibs and you have ${have}: the set-ups say how to manage.`);
}

/* Swap one drill for a different one that suits the same slot */
function swapSlot(i) {
  const sl = PLAN.slots[i], N = PLAN.N;
  sl.tried = sl.tried || new Set([sl.d.id]);
  let ballsLeft = N.balls;
  if (sl.role === 's') PLAN.blocks[sl.block].slots.forEach(j => { if (j !== i) ballsLeft -= PLAN.slots[j].nd.balls; });
  const base = { role: sl.role, n: sl.n, lo: sl.lo, hi: sl.hi, mins: sl.mins, ballsLeft: Math.max(0, ballsLeft), cones: null, bibs: N.bibs, minAreas: sl.minAreas || 1,
    like: sl.d, rand: Math.random, strict: true };
  const inPlan = new Set(PLAN.slots.map(s => s.d.id));
  let r = pickDrill(Object.assign({ exclude: new Set([...inPlan, ...sl.tried]) }, base));
  if (!r) { sl.tried = new Set([sl.d.id]); r = pickDrill(Object.assign({ exclude: inPlan }, base)); }
  if (!r) { toast('No other drill suits this slot tonight.'); return; }
  sl.tried.add(r.d.id);
  sl.d = r.d; sl.nd = r.nd;
  addKitNotes(PLAN);
  renderOverview();
  const old = document.getElementById('slot-' + i);
  resetAnims(old);
  const card = cardEl(sl.d, sl, i);
  old.replaceWith(card);
  card.classList.add('flash');
  toast(`Swapped in ${r.d.name}`);
}

/* =========================================================
   6. RENDERING
   ========================================================= */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function joinList(a, word = 'and') { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' ' + word + ' ' + a[a.length - 1]; }
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.1l-5.7 3.2 1.2-6.4-4.7-4.4 6.4-.8z" stroke-linejoin="round"/></svg>';
const SWAP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* Where everything goes on the big pitches.
   A caged 8v8 pitch fits 2–3 drill areas (ends and middle) or 2 small games across its width. */
function layout(plan) {
  const np = plan.st.pitches || 2, at = {}, notes = [];
  const pos = (j, m) => m === 2 ? ['one end', 'the other end'][j] : m === 3 ? ['one end', 'the middle', 'the other end'][j] : `area ${j + 1}`;
  const spread = a => {                       // a areas over np pitches: counts per pitch
    const per = Math.ceil(a / np), out = [];
    for (let left = a; left > 0; left -= per) out.push(Math.min(per, left));
    return out;
  };
  plan.phases.forEach(ph => {
    const sl = plan.slots[ph[0]];
    if (ph.length > 1) {
      const k = ph.length, onPitch = Array.from({ length: np }, () => []);
      ph.forEach((idx, s) => onPitch[Math.min(np - 1, Math.floor(s * np / k))].push(idx));   // stations 1–2 on Pitch 1, 3–4 on Pitch 2
      onPitch.forEach((list, p) => {
        const areas = list.reduce((a, i) => a + plan.slots[i].nd.areas, 0);
        if (areas > 4) notes.push(`Pitch ${p + 1} holds ${areas} station areas: keep each one small.`);
        list.forEach((idx, j) => { at[idx] = list.length === 1 ? `Pitch ${p + 1}` : `Pitch ${p + 1}, ${pos(j, list.length)}`; });
      });
      return;
    }
    const a = sl.nd.areas, i = ph[0];
    if (sl.role === 'a' && plan.st.squads) { at[i] = np >= 2 ? 'Reds on Pitch 1, Greens on Pitch 2' : 'Pitch 1: Reds one end, Greens the other'; return; }
    if (sl.role === 'g') {
      const c = spread(a);
      if (c.some(n => n > 3)) notes.push('That\'s a lot of games per pitch: make them smaller or add a pitch.');
      at[i] = a === 1 ? 'Pitch 1, played across the width'
        : c.every(n => n === 1) ? (c.length === np ? 'One game on each pitch, played across the width' : `One game on each of pitches ${joinList(c.map((n, p) => p + 1))}, across the width`)
        : c.map((n, p) => `Pitch ${p + 1}: ${n === 1 ? '1 game' : n + ' games side by side, across the width'}`).join('; ');
      return;
    }
    if (a === 1) { at[i] = 'Pitch 1'; return; }
    const c = spread(a);
    at[i] = c.length === 1 ? `Pitch 1, ${a} areas side by side`
      : c.every(n => n === 1) ? (c.length === np ? 'One area on each pitch' : `One area on each of pitches ${joinList(c.map((n, p) => p + 1))}`)
      : c.map((n, p) => `Pitch ${p + 1}: ${n === 1 ? '1 area' : n + ' areas'}`).join('; ');
  });
  return { at, notes };
}

function renderOverview() {
  const P = PLAN, N = P.N, st = P.st, kit = kitTotals(P);
  LAYOUT = layout(P);
  const box = $('#overview');
  const rng2 = (r, u) => r.unknown ? u : (r.min === r.max ? r.min : `${r.min}–${r.max}`);
  const sumLine = `${st.length} minutes for ${rng2(st.players, 'about 14')} players and ${rng2(st.coaches, '2')} coaches.`;
  const segs = P.phases.map(ph => {
    const sl = P.slots[ph[0]], mins = ph.length > 1 ? sl.k * sl.mins : sl.mins;
    const label = sl.role === 'a' ? 'Arrive' : sl.role === 'w' ? `${mins}′` : sl.role === 'g' ? `Game ${mins}′` : (ph.length > 1 ? `${ph.length} stations` : esc(sl.d.name));
    return `<span class="${sl.role}" style="flex:${mins}">${label}</span>`;
  });
  const order = P.slots.map((sl, i) => {
    let sub;
    if (sl.role === 'a') sub = st.squads ? 'Arrivals and warm-up: Reds and Greens to their own pitch' : 'Arrivals and warm-up: start with whoever is here';
    else if (sl.role === 'w') sub = `Warm-up, everyone${sl.nd.areas > 1 ? ` in ${sl.nd.areas} areas` : ' together'}`;
    else if (sl.role === 'g') sub = `Final game, ${sl.nd.areas === 1 ? 'one game' : sl.nd.areas + ' games at once'}`;
    else sub = sl.k > 1 ? `Station ${sl.station + 1}, ${sl.mins} min per group` : `Everyone${sl.nd.areas > 1 ? ` in ${sl.nd.areas} areas` : ' together'}`;
    sub += `. ${LAYOUT.at[i]}`;
    const time = sl.role === 's' && sl.k > 1 ? `${sl.start}–${sl.end}′` : `${sl.start}–${sl.start + sl.mins}′`;
    return `<li><a href="#slot-${i}"><span class="t">${time}</span><span class="n">${i + 1}</span><span class="what">${esc(sl.d.name)}<small>${sub}</small></span></a></li>`;
  }).join('');
  const rotas = P.blocks.filter(b => b.k > 1).map(b => {
    const k = b.k, size = Math.floor(N.P / k), big = N.P % k, gs = groupList(k, st, N.P);
    const sizeText = big ? `${size}–${size + 1}` : `${size}`;
    let rows = '';
    for (let r = 0; r < k; r++) {
      rows += `<tr><td class="time">${b.start + r * b.R}–${b.start + (r + 1) * b.R}′</td>` +
        Array.from({ length: k }, (_, s) => { const g = gs[(s - r + k) % k]; return `<td style="background:${g.hex};color:${g.dark ? '#14213D' : '#fff'}">${esc(g.name)}</td>`; }).join('') + '</tr>';
    }
    const heads = b.slots.map((i, s) => `<th>Station ${s + 1}<small>${esc(P.slots[i].d.name)}</small><small>${esc(LAYOUT.at[i])}</small></th>`).join('');
    const wear = gs[0].bibs && gs.every(g => g.bibs) ? ' Each group wears its own bib colour.' : '';
    return `<div class="panel"><h2>Stations, minutes ${b.start}–${b.end}</h2>
      <p>Split into ${k} groups of ${sizeText}: ${joinList(gs.map(g => g.name))}.${wear} One coach stays at each station. Every ${b.R} minutes, each group moves on one station (Station ${k} goes back to Station 1). Set out all ${k} stations before kick-off; the cones stay put.</p>
      <div class="rota-wrap"><table class="rota"><thead><tr><th></th>${heads}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  const spare = Math.max(0, N.C - Math.max(1, ...P.blocks.map(b => b.k)));
  const bibNote = !kit.bibs ? 'Not needed' : N.bibs ? `You have ${N.bibs}` : 'None entered';
  box.innerHTML = `
    <div class="plan-top"><button class="back" data-go="setup">‹ Change setup</button>
      <h1>Tonight's plan</h1><p class="sum">${sumLine}</p></div>
    <div class="share-row"><button type="button" class="wa" data-share="wa">${WA_ICON} Share on WhatsApp</button><button type="button" class="copy" data-share="copy">Copy</button></div>
    ${P.notes.concat(LAYOUT.notes).length ? `<ul class="notes">${P.notes.concat(LAYOUT.notes).map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    <div class="strip" aria-hidden="true">${segs.join('')}</div>
    <ol class="order">${order}</ol>
    ${rotas}
    <div class="panel"><h2>Kit for tonight</h2>
      <div class="kit">

function setupLines(d, sl, nd) {
  const per = Math.round(nd.per), lines = [];
  const fill = s => s.replace(/\{per\}/g, per).replace(/\{half\}/g, Math.max(1, Math.floor(per / 2))).replace(/\{few\}/g, Math.max(1, Math.round(per / 5)));
  const squads = sl && sl.role === 'a' && PLAN.st.squads;
  if (sl && sl.role === 'a') lines.push('Set this up before the first player arrives. Start as soon as two are here; late arrivals just join in.');
  if (squads) lines.push(`Set it up ${nd.areas === 2 ? 'twice' : nd.areas + ' times'}: a Reds pitch and a Greens pitch. As each player arrives, point them to their squad's pitch.`);
  if (sl && sl.role === 's' && sl.k > 1) lines.push(`Each group (about ${sl.n} players) comes through this station once.`);
  if (nd.areas > 1 && !squads) lines.push(`Make ${nd.areas} of these areas side by side, about ${per} players in each.`);
  d.setup.forEach(s => lines.push(fill(s)));
  const bits = [];
  if (nd.balls) bits.push(plural(nd.balls, 'ball'));
  if (nd.cones) bits.push(plural(nd.cones, 'cone'));
  if (nd.bibs) bits.push(plural(nd.bibs, 'bib'));
  if (bits.length) lines.push('Kit: ' + joinList(bits) + '.');
  const sets = sl ? PLAN.st.bibSets : [], have = sets.reduce((a, s) => a + s.n, 0);
  if (nd.bibs && have >= nd.bibs && sets.length) {
    const pick = sets.find(s => s.n >= nd.bibs);
    lines.push(pick ? `Use the ${pick.c.toLowerCase()} bibs.` : `Use bibs from your ${joinList(sets.map(s => s.c.toLowerCase()))} sets.`);
  } else if (nd.bibs) {
    lines.push(d.bibs === 'team' ? 'Not enough bibs? One team keeps their jackets on.' : 'No bibs? Taggers hold a cone in their hand.');
  }
  return lines;
}

function renderBibs() {
  const box = $('#bibSets'), used = S.bibSets.map(s => s.c);

      : '<p class="small-note" style="margin:0 0 10px">No bibs added. Add a set for each colour you have.</p>') +

function syncSetup() {
  document.querySelectorAll('[data-out]').forEach(o => {
    const path = o.dataset.out;
    let v;
    if (path.startsWith('bib.')) v = S.bibSets[+path.slice(4)].n;
    else if (path.includes('.')) { const [k, m] = path.split('.'); v = S[k][m]; }
    else v = S[path];
    if (document.activeElement !== o) o.value = v == null ? '' : v;
    o.placeholder = v == null ? 'Not set' : '';
    o.classList.toggle('unset', v == null);
  });
  ['players', 'coaches'].forEach(k => {
    const f = document.querySelector(`[data-field="${k}"]`);
    f.classList.toggle('is-unknown', S[k].unknown);
    f.querySelector('[data-unknown]').setAttribute('aria-pressed', S[k].unknown);
  });
  document.querySelector('[data-clear="balls"]').setAttribute('aria-pressed', S.balls == null);
  document.querySelectorAll('[data-len]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.len === S.length));
  document.querySelectorAll('[data-arr]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.arr === S.arrival));
  $('#squadRow').hidden = !S.arrival;
  document.querySelector('[data-squads]').setAttribute('aria-pressed', S.squads);
  document.querySelectorAll('[data-focus]').forEach(b => b.setAttribute('aria-pressed', S.focus.includes(b.dataset.focus)));

function step(path, d) {
  if (path.startsWith('bib.')) {
    const s = S.bibSets[+path.slice(4)];
    s.n = clamp(s.n + d, LIMITS.bib[0], LIMITS.bib[1]);
  } else if (path.includes('.')) {
    const [lo, hi, inc] = LIMITS[path], [k, m] = path.split('.'), r = S[k];
    r.unknown = false;
    r[m] = clamp(r[m] + d * inc, lo, hi);
    if (m === 'min' && r.max < r.min) r.max = r.min;
    if (m === 'max' && r.min > r.max) r.min = r.max;
  } else if (path === 'drills' || path === 'pitches') {
    S[path] = clamp(S[path] + d, LIMITS[path][0], LIMITS[path][1]);
  } else if (S[path] == null) {
    S[path] = S.players.unknown ? 14 : Math.round((S.players.min + S.players.max) / 2);
  } else {
    S[path] = clamp(S[path] + d * LIMITS[path][2], LIMITS[path][0], LIMITS[path][1]);
  }
  syncSetup();
}
/* typed numbers: clamp to the allowed range; a blank box clears an optional field */
function setVal(path, raw) {
  const txt = String(raw).trim(), v = parseInt(txt, 10);
  if (path.startsWith('bib.')) { if (!isNaN(v)) S.bibSets[+path.slice(4)].n = clamp(v, LIMITS.bib[0], LIMITS.bib[1]); }
  else if (path.includes('.')) {
    if (!isNaN(v)) {
      const [lo, hi] = LIMITS[path], [k, m] = path.split('.'), r = S[k];
      r.unknown = false; r[m] = clamp(v, lo, hi);
      if (m === 'min' && r.max < r.min) r.max = r.min;
      if (m === 'max' && r.min > r.max) r.min = r.max;
    }
  } else if (path === 'drills' || path === 'pitches') { if (!isNaN(v)) S[path] = clamp(v, LIMITS[path][0], LIMITS[path][1]); }
  else S[path] = txt === '' || isNaN(v) ? null : clamp(v, LIMITS[path][0], LIMITS[path][1]);
  syncSetup();
}
/* steppers: tap to change by one, hold to keep going, or tap the number and type */
function bindSteppers(root) {
  let holdT = 0, repT = 0;
  const stop = () => { clearTimeout(holdT); clearInterval(repT); };
  root.querySelectorAll('[data-step]').forEach(b => {
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      stop();
      const go = () => step(b.dataset.step, +b.dataset.d);
      go();
      holdT = setTimeout(() => { repT = setInterval(go, 90); }, 420);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('click', e => { if (e.detail === 0) step(b.dataset.step, +b.dataset.d); });   // keyboard
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  root.querySelectorAll('input.num-in').forEach(inp => {
    inp.addEventListener('focus', () => { inp.select(); setTimeout(() => inp.select(), 0); });
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 3); });
    inp.addEventListener('change', () => setVal(inp.dataset.out, inp.value));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  });
}
function bindSetup() {
  const root = $('#view-setup');
  bindSteppers(root);
  root.querySelectorAll('[data-unknown]').forEach(b => b.onclick = () => { const k = b.dataset.unknown; S[k].unknown = !S[k].unknown; syncSetup(); });
  root.querySelector('[data-clear="balls"]').onclick = () => { if (S.balls == null) step('balls', 0); else { S.balls = null; syncSetup(); } };
  root.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { S.length = +b.dataset.len; syncSetup(); });
  root.querySelectorAll('[data-arr]').forEach(b => b.onclick = () => { S.arrival = +b.dataset.arr; syncSetup(); });
  root.querySelector('[data-squads]').onclick = () => { S.squads = !S.squads; syncSetup(); };
  root.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => {
    const f = b.dataset.focus;
    S.focus = S.focus.includes(f) ? S.focus.filter(x => x !== f) : S.focus.concat(f);
    syncSetup();
  });
  root.querySelector('[data-favfirst]').onclick = () => { S.favFirst = !S.favFirst; syncSetup(); };
  $('#goBtn').onclick = () => {
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains('num-in')) setVal(a.dataset.out, a.value);
    PLAN = buildPlan(S);
    document.querySelector('[data-go="plan"]').disabled = false;
    renderPlan();
    show('plan');
  };
}

   ========================================================= */
/* Share as real text: the phone's share sheet first (pick WhatsApp there),
   then fall back to copying the text and opening WhatsApp. */
async function openWhatsApp(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }      // user closed the share sheet
  }
  copyText(text, true);
  toast('Text copied. If WhatsApp only shows a link, paste the message instead.');
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
function copyText(text, quiet) {
  const done = () => { if (!quiet) toast('Copied: paste it into WhatsApp'); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copy blocked: select and copy the text by hand'); }
  ta.remove();
}

/* The session as a WhatsApp message (WhatsApp shows *text* in bold) */
function sessionText(P) {
  const st = P.st, L = [];
  LAYOUT = layout(P);
  const rng2 = (r, u) => r.unknown ? u : (r.min === r.max ? r.min : `${r.min}–${r.max}`);
  L.push(`⚽ *Training tonight*: ${st.length} minutes, ${rng2(st.players, 'about 14')} players`);
  P.phases.forEach(ph => {
    const sl = P.slots[ph[0]];
    L.push('');
    if (ph.length > 1) {
      const b = P.blocks[sl.block], gs = groupList(b.k, st, P.N.P);
      L.push(`*${b.start}–${b.end}′ Stations* (${b.R} min each, groups ${joinList(gs.map(g => g.name.replace(/^Group /, '')))} move one station on each time)`);
      ph.forEach((i, s) => { const d = P.slots[i].d; L.push(`${s + 1}. *${d.name}* (${LAYOUT.at[i]}): ${d.how}`); });
    } else {
      const label = sl.role === 'a' ? 'Arrivals and warm-up' : sl.role === 'w' ? 'Warm-up' : sl.role === 'g' ? 'Final game' : 'Everyone';
      L.push(`*${sl.start}–${sl.start + sl.mins}′ ${label}: ${sl.d.name}*`);
      L.push(`📍 ${LAYOUT.at[ph[0]]}`);
      L.push(sl.d.how);
    }
  });
  const kit = kitTotals(P);
  L.push('', `🎒 Kit: ${kit.balls} balls, ${kit.cones} cones${kit.bibs ? `, ${kit.bibs} bibs` : ''}`);
  return L.join('\n');
}

/* =========================================================
   10. MATCHDAY GAME TIME
   Each squad plays as two teams of 5 on two pitches at once,
   then the teams swap opponents: 2 matches, 4 halves in all.
   "First half only" = match 1, "second half only" = match 2.
   ========================================================= */
const MD_KEY = 'trainingTonight.matchday.v1';
let MD = { squad: 'Reds', half: 10, size: 5, seed: 1, paste: '', squads: { Reds: [], Greens: [] } };
try { const s = JSON.parse(localStorage.getItem(MD_KEY) || 'null'); if (s && s.squads) MD = Object.assign(MD, s); } catch (e) { /* first visit */ }
function saveMD() { try { localStorage.setItem(MD_KEY, JSON.stringify(MD)); } catch (e) { /* storage blocked */ } }
let MD_RESULT = null;
const AV = [['full', 'Full'], ['first', '1st half'], ['second', '2nd half'], ['out', 'Out']];
const PERIODS = ['Match 1, 1st half', 'Match 1, 2nd half', 'Match 2, 1st half', 'Match 2, 2nd half'];
const PERIOD_SHORT = ['M1 1st', 'M1 2nd', 'M2 1st', 'M2 2nd'];
const quartersFor = a => a === 'full' ? [0, 1, 2, 3] : a === 'first' ? [0, 1] : a === 'second' ? [2, 3] : [];

function availabilityMessage(squad) {
  return `⚽ *Saturday matches: ${squad}*\nPlease add your son's name under ONE heading, then copy the whole message and post it back in the group.\n\n✅ Full morning:\n\n🕐 First half only (match 1):\n\n🕑 Second half only (match 2):\n\n❌ Can't play:\n`;
}

/* Read names under the headings from a pasted WhatsApp message */
function parseReplies(text) {
  const found = [];
  let cur = null;
  const headOf = s => {
    if (/can'?t|cannot|can not|not (playing|available)|unavailable|\bout\b|\bno\b/.test(s)) return 'out';
    if (/second|2nd|match 2|later/.test(s)) return 'second';
    if (/first|1st|match 1|early/.test(s)) return 'first';
    if (/full|all|whole|both/.test(s)) return 'full';
    return null;
  };
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.replace(/^\[[^\]]{4,30}\]\s*[^:]{1,40}:\s*/, '')                 // "[10/10/2026, 18:01] Name:" prefixes
      .replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F\u200D*_~]/gu, ' ').trim();
    if (!line) continue;
    const low = line.toLowerCase(), colon = line.indexOf(':');
    const headPart = colon >= 0 ? low.slice(0, colon) : low;
    const h = headOf(headPart);
    const words = headPart.split(/\s+/).length;
    let names = '';
    if (h && (colon >= 0 || words <= 6) && !/saturday|please|add your/.test(headPart)) { cur = h; names = colon >= 0 ? line.slice(colon + 1) : ''; }
    else if (cur) names = line;
    if (!cur || !names.trim()) continue;
    names.split(/,|&|\+|\/|\band\b/i).forEach(n => {
      const name = n.replace(/^\s*\d+\s*[.)]\s*/, '').replace(/^[\s\-•·]+/, '').replace(/[.!?()]+$/g, '').trim();
      if (name.length >= 2 && name.length <= 30 && !/please|heading|message|group/i.test(name)) {
        found.push({ name: name.replace(/\b\w/g, c => c.toUpperCase()), avail: cur });
      }
    });
  }
  return found;
}
function mergeReplies(list) {
  const squad = MD.squads[MD.squad];
  list.forEach(({ name, avail }) => {
    const low = name.toLowerCase(), first = low.split(' ')[0];
    let kid = squad.find(k => k.name.toLowerCase() === low);
    if (!kid) { const m = squad.filter(k => k.name.toLowerCase().split(' ')[0] === first); if (m.length === 1 && !low.includes(' ')) kid = m[0]; }
    if (kid) kid.avail = avail; else squad.push({ name, avail });
  });
  saveMD();
}

/* Share the halves fairly. Kids stay with one team all morning. */
function allocate(kids, size, seed) {
  const rand = rng(seed);
  const avail = kids.filter(k => quartersFor(k.avail).length);
  const order = avail.map(k => ({ k, r: rand() }))
    .sort((a, b) => quartersFor(a.k.avail).length - quartersFor(b.k.avail).length || a.r - b.r).map(o => o.k);
  const teams = [[], []], cnt = [[0, 0, 0, 0], [0, 0, 0, 0]];
  order.forEach(k => {
    const q = quartersFor(k.avail), cost = t => q.reduce((a, x) => a + cnt[t][x], 0) * 10 + teams[t].length;
    const t = cost(0) < cost(1) ? 0 : cost(1) < cost(0) ? 1 : (rand() < .5 ? 0 : 1);
    teams[t].push(k); q.forEach(x => cnt[t][x]++);
  });
  const notes = [];
  const result = teams.map((tm, ti) => {
    const played = new Map(tm.map(k => [k.name, 0])), gk = new Map(tm.map(k => [k.name, 0])), tie = new Map(tm.map(k => [k.name, rand()]));
    const quarters = [0, 1, 2, 3].map(q => {
      const av = tm.filter(k => quartersFor(k.avail).includes(q));
      const future = k => quartersFor(k.avail).filter(x => x > q).length;
      av.sort((a, b) => played.get(a.name) - played.get(b.name) || future(a) - future(b) || tie.get(a.name) - tie.get(b.name));
      const on = av.slice(0, size), bench = av.slice(size);
      on.forEach(k => played.set(k.name, played.get(k.name) + 1));
      let keeper = null;
      if (on.length) {
        keeper = on.slice().sort((a, b) => gk.get(a.name) - gk.get(b.name) || tie.get(a.name) - tie.get(b.name))[0].name;
        gk.set(keeper, gk.get(keeper) + 1);
      }
      if (on.length < size) notes.push(`Team ${ti + 1} has only ${on.length} for ${PERIODS[q].toLowerCase()}: play ${on.length}-a-side or borrow a player.`);
      return { on: on.map(k => k.name), bench: bench.map(k => k.name), keeper };
    });
    return { kids: tm, quarters, played, gk };
  });
  return { teams: result, notes };
}

function lineupText(res) {
  const L = [`⚽ *${MD.squad}: Saturday game time* (halves of ${MD.half} min)`];
  res.teams.forEach((t, ti) => {
    L.push('', `*${MD.squad} ${ti + 1}*`);
    t.quarters.forEach((q, i) => {
      if (!q.on.length) return;
      const on = q.on.map(n => n === q.keeper ? `${n} (GK)` : n).join(', ');
      L.push(`${PERIODS[i]}: ${on}${q.bench.length ? `. Sub: ${q.bench.join(', ')}` : ''}`);
    });
    L.push('Minutes: ' + t.kids.map(k => `${k.name} ${t.played.get(k.name) * MD.half}`).join(', '));
  });
  return L.join('\n');
}

function renderMatch() {
  const v = $('#view-match'), squad = MD.squads[MD.squad];
  const counts = { full: 0, first: 0, second: 0, out: 0, '?': 0 };
  squad.forEach(k => counts[k.avail || '?']++);
  v.innerHTML = `
    <div class="plan-top"><h1>Saturday game time</h1>
      <p class="sum">Each squad plays as two teams of ${MD.size} on two pitches, then the teams swap opponents. Two matches, four halves.</p></div>
    <div class="chips" style="margin-top:14px">${['Reds', 'Greens'].map(s => `<button type="button" class="chip squad-${s}" data-squad="${s}" aria-pressed="${MD.squad === s}">${s}</button>`).join('')}</div>
    <div class="panel"><h2>1. Ask who can play</h2>
      <p>Post this in the parents' group. Each parent adds their son's name under one heading and posts the list back.</p>
      <div class="share-row"><button type="button" class="wa" data-act="askwa">${WA_ICON} Send on WhatsApp</button><button type="button" class="copy" data-act="askcopy">Copy</button></div></div>
    <div class="panel"><h2>2. Paste the replies</h2>
      <p>Copy the latest version of the list from WhatsApp and paste it here.</p>
      <textarea id="mdPaste" rows="6" placeholder="Paste the WhatsApp list here">${esc(MD.paste || '')}</textarea>
      <button type="button" class="swap" data-act="read" style="margin-top:10px">Read the names</button></div>
    <div class="panel"><h2>3. Check the squad</h2>
      <p>${squad.length ? `${counts.full} full, ${counts.first} first half, ${counts.second} second half, ${counts.out} out${counts['?'] ? `, ${counts['?']} not replied` : ''}. Tap to change anyone.` : 'No names yet. Paste the replies above, or add names below.'}</p>
      <div class="kids">${squad.map((k, i) => `
        <div class="kid${k.avail && k.avail !== '?' ? '' : ' unk'}"><span class="kname">${esc(k.name)}</span>
          <div class="seg">${AV.map(([a, l]) => `<button type="button" data-kid="${i}" data-av="${a}" aria-pressed="${k.avail === a}">${l}</button>`).join('')}</div>
          <button type="button" class="kdel" data-del="${i}" aria-label="Remove ${esc(k.name)}">×</button></div>`).join('')}</div>
      <div class="addkid"><input id="mdName" type="text" placeholder="Add a name" autocomplete="off"><button type="button" class="chip" data-act="add">Add</button></div>
      <div class="md-set">
        <div><b>Half length</b><div class="mini"><button type="button" data-md="half" data-d="-1" aria-label="Shorter halves">−</button><span>${MD.half} min</span><button type="button" data-md="half" data-d="1" aria-label="Longer halves">+</button></div></div>
        <div><b>Players per team</b><div class="mini"><button type="button" data-md="size" data-d="-1" aria-label="Fewer per team">−</button><span>${MD.size}</span><button type="button" data-md="size" data-d="1" aria-label="More per team">+</button></div></div>
      </div>
      ${squad.length ? '<button type="button" class="back" data-act="reset">New week: clear everyone\'s answer</button>' : ''}</div>
    <button type="button" class="go" data-act="plan">Plan game time</button>
    <div id="mdResult"></div>`;
  bindMatch();
  if (MD_RESULT && MD_RESULT.squad === MD.squad) renderResult();
}

function renderResult() {
  const box = $('#mdResult'), res = MD_RESULT.res;
  const notReplied = MD.squads[MD.squad].filter(k => !k.avail || k.avail === '?').length;
  const notes = res.notes.slice();
  if (notReplied) notes.unshift(`${notReplied} not replied yet, so they're left out. Mark them and plan again.`);
  box.innerHTML = `
    ${notes.length ? `<ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    ${res.teams.map((t, ti) => `
      <div class="panel"><h2>${MD.squad} ${ti + 1}</h2>
        <div class="rota-wrap"><table class="gt">
          <thead><tr><th>Player</th>${PERIOD_SHORT.map(p => `<th>${p}</th>`).join('')}<th>Mins</th></tr></thead>
          <tbody>${t.kids.map(k => `<tr><td class="nm">${esc(k.name)}</td>${t.quarters.map((q, qi) => {
            if (!quartersFor(k.avail).includes(qi)) return '<td class="na">·</td>';
            if (q.keeper === k.name) return '<td class="gk">GK</td>';
            return q.on.includes(k.name) ? '<td class="on">✓</td>' : '<td class="sub">Sub</td>';
          }).join('')}<td class="mins">${t.played.get(k.name) * MD.half}</td></tr>`).join('')}</tbody>
        </table></div></div>`).join('')}
    <p class="small-note">✓ playing, GK in goal, Sub on the bench, · not there.</p>
    <div class="share-row" style="margin-top:12px"><button type="button" class="wa" data-act="lineupwa">${WA_ICON} Send on WhatsApp</button><button type="button" class="copy" data-act="lineupcopy">Copy</button></div>
    <button type="button" class="swap" data-act="shuffle" style="margin-top:12px">Shuffle the two teams</button>`;
  box.querySelectorAll('[data-act]').forEach(b => b.onclick = () => matchAction(b.dataset.act));
}

function matchAction(act) {
  const squad = MD.squads[MD.squad];
  if (act === 'askwa') openWhatsApp(availabilityMessage(MD.squad));
  if (act === 'askcopy') copyText(availabilityMessage(MD.squad));
  if (act === 'read') {
    MD.paste = $('#mdPaste').value;
    const list = parseReplies(MD.paste);
    if (!list.length) { saveMD(); toast('No names found under the headings. Check the paste.'); return; }
    mergeReplies(list); renderMatch(); toast(`Read ${plural(list.length, 'name')}`);
  }
  if (act === 'add') {
    const inp = $('#mdName'), name = inp.value.trim();
    if (name) { squad.push({ name, avail: '?' }); saveMD(); renderMatch(); $('#mdName').focus(); }
  }
  if (act === 'reset') { squad.forEach(k => { k.avail = '?'; }); MD.paste = ''; MD_RESULT = null; saveMD(); renderMatch(); toast('Ready for a new week'); }
  if (act === 'plan' || act === 'shuffle') {
    if (act === 'shuffle') MD.seed = (MD.seed * 7 + 13) % 100003;
    const playing = squad.filter(k => quartersFor(k.avail).length);
    if (!playing.length) { toast('Mark who can play first'); return; }
    MD_RESULT = { squad: MD.squad, res: allocate(squad, MD.size, MD.seed) };
    saveMD(); renderResult();
    $('#mdResult').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  }
  if (act === 'lineupwa') openWhatsApp(lineupText(MD_RESULT.res));
  if (act === 'lineupcopy') copyText(lineupText(MD_RESULT.res));
}

function bindMatch() {
  const v = $('#view-match');
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => matchAction(b.dataset.act));
  v.querySelectorAll('[data-squad]').forEach(b => b.onclick = () => { MD.squad = b.dataset.squad; MD.paste = ''; saveMD(); renderMatch(); });
  v.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => {
    const k = MD.squads[MD.squad][+b.dataset.kid];
    k.avail = k.avail === b.dataset.av ? '?' : b.dataset.av; saveMD();
    const row = b.closest('.kid');
    row.querySelectorAll('[data-av]').forEach(x => x.setAttribute('aria-pressed', x.dataset.av === k.avail));
    row.classList.toggle('unk', k.avail === '?');
  });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { MD.squads[MD.squad].splice(+b.dataset.del, 1); saveMD(); renderMatch(); });
  v.querySelectorAll('[data-md]').forEach(b => b.onclick = () => {
    const k = b.dataset.md, lim = k === 'half' ? [5, 30] : [3, 7];
    MD[k] = clamp(MD[k] + +b.dataset.d, lim[0], lim[1]); saveMD(); renderMatch();
  });
  $('#mdPaste').addEventListener('input', e => { MD.paste = e.target.value; saveMD(); });
  $('#mdName').addEventListener('keydown', e => { if (e.key === 'Enter') matchAction('add'); });
}
const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>';
</script>
