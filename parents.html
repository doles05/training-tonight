<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Saturday matches</title>
<style>
:root{--ink:#14213D;--ink2:#4A5870;--paper:#F1F4EC;--card:#fff;--line:#D8E0CF;--bib:#FFD23F;--red:#C8102E;--green:#0F7B3F;--sky:#1E6FD9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.top svg{width:22px;height:22px}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px;display:grid;gap:24px}
h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
h2{margin:0 0 10px;font-size:17px;font-weight:900}
.lead{margin:8px 0 0;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px;padding:8px 6px}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sq{min-height:58px;border-radius:14px;font-size:20px;font-weight:900}
.sq.Reds[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.sq.Greens[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.long{display:grid;gap:8px}
.long .opt{text-align:left;padding:10px 16px;min-height:60px}
.long .opt b{display:block;font-size:17px}
.long .opt span{display:block;font-size:14px;font-weight:600;opacity:.85}
.fixture{background:var(--card);border-radius:18px;padding:16px;border-top:7px solid var(--green);display:grid;gap:10px}
.fixture.Reds{border-top-color:var(--red)}
.fixture .when{font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.fixture .vs{font-size:24px;font-weight:900;line-height:1.15}
.fixture .row{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}
.fixture .row b{display:block;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.fixture .venue{font-weight:700}
.map{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;background:#E8F0FE;color:#0F4FA8;font-weight:900;text-decoration:none}
.map svg{width:20px;height:20px}
.mapbox{border-radius:12px;overflow:hidden;background:#DDE5D6;aspect-ratio:16/10}
.mapbox iframe{display:block;width:100%;height:100%;border:0}
.muted{color:var(--ink2);font-size:15px;margin:0}
.send{width:100%;min-height:62px;border:0;border-radius:16px;background:var(--bib);color:var(--ink);font-size:22px;font-weight:900;box-shadow:0 3px 0 #C9A21A}
.send:disabled{background:#E3E7DD;color:#6B7686;box-shadow:none}
.done{background:#DDF3E3;border-radius:16px;padding:16px 18px;display:grid;gap:8px}
.done b{font-size:20px;color:#14532D}
.done p{margin:0;color:#1F4D2E}
.again{justify-self:start;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid #14532D;background:#fff;color:#14532D;font-weight:800}
.err{background:#FFF3C4;border-radius:12px;padding:12px 14px}
</style>
</head>
<body>
<div class="top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 20h16z" fill="#FF7A1A"/><path d="M8.2 12.5h7.6" stroke="#fff" stroke-width="1.6"/></svg>Saturday matches</div>
<main id="app"><p class="muted">Loading…</p></main>
<script>
"use strict";
/* The shared Google Sheet ("the box") that stores answers and fixtures */
const API = 'https://script.google.com/macros/s/AKfycbyqVWI2oOrU_SyXriPu8-bIgVEg6sc9vEbVx7c3-ZvO6Z4B57JyTQw2uVG2dlHCIsIa/exec';
const SQUADS = [['Reds', 'Red squad'], ['Greens', 'Green squad']];
const OPTS = [['full', 'Full game', 'Both matches'], ['first', 'First half only', 'Match 1'], ['second', 'Second half only', 'Match 2'], ['out', 'Can\u2019t play', 'Not this week']];
const PIN_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.6" fill="currentColor"/></svg>';
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let INFO = {}, st = { squad: null, kid: null, avail: null, sending: false, sent: null, error: '' };
try { st.squad = localStorage.getItem('tt.parent.squad'); } catch (e) {}

const placeQuery = f => [f.venue, f.eircode].filter(Boolean).join(', ');
function mapUrl(f) { return f.map && /^https?:\/\//.test(f.map) ? f.map : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(placeQuery(f)); }
const embedUrl = q => 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&z=15&output=embed';
function dateText(iso) { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fixtureFor(sq) {
  const f = INFO['fixture:' + sq];
  if (!f || !f.date) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return new Date(f.date + 'T23:59:00') >= today ? f : null;        // past fixtures don't show
}

function render() {
  const names = ((INFO.squads || {})[st.squad] || []).slice().sort((a, b) => a.localeCompare(b));
  const f = st.squad ? fixtureFor(st.squad) : null;
  const label = st.squad ? SQUADS.find(s => s[0] === st.squad)[1] : '';
  let h = `<div><h1>Can your son play on Saturday?</h1><p class="lead">Tap his squad, his name, and how long he can play.</p></div>`;
  if (st.error) h += `<div class="err">${esc(st.error)}</div>`;
  h += `<section><h2>1. Squad</h2><div class="grid2">${SQUADS.map(([k, l]) => `<button type="button" class="opt sq ${k}" data-squad="${k}" aria-pressed="${st.squad === k}">${l.replace(' squad', '')}</button>`).join('')}</div></section>`;
  if (st.squad) {
    if (f) {
      h += `<section class="fixture ${st.squad}"><div class="when">${esc(label)} · ${esc(dateText(f.date))}</div>
        <div class="vs">v ${esc(f.opp || 'Opposition to be confirmed')}</div>
        ${f.venue ? `<div class="venue">${esc(f.venue)}</div>` : ''}
        <div class="row">${f.meet ? `<div><b>Meet</b>${esc(f.meet)}</div>` : ''}${f.ko ? `<div><b>Kick-off</b>${esc(f.ko)}</div>` : ''}</div>
        ${placeQuery(f) ? `<div class="mapbox"><iframe title="Map of ${esc(placeQuery(f))}" src="${esc(embedUrl(placeQuery(f)))}" loading="lazy"></iframe></div>` : ''}
        ${placeQuery(f) || f.map ? `<a class="map" href="${esc(mapUrl(f))}" target="_blank" rel="noopener">${PIN_ICON}Open in Google Maps</a>` : ''}</section>`;
    } else {
      h += `<p class="muted">Match details for this Saturday will appear here once the coaches add them.</p>`;
    }
    if (st.sent) {
      h += `<div class="done" role="status"><b>Thanks! ${esc(st.sent)}</b><p>Change of plan? Just send it again; the newest answer counts.</p><button type="button" class="again" data-again>Send for another boy</button></div>`;
    } else {
      h += `<section><h2>2. Your son</h2>${names.length ? `<div class="grid3">${names.map(n => `<button type="button" class="opt" data-kid="${esc(n)}" aria-pressed="${st.kid === n}">${esc(n)}</button>`).join('')}</div><p class="muted" style="margin-top:8px">Name missing? Message the coach.</p>` : '<p class="muted">The coaches haven\u2019t added the names yet.</p>'}</section>`;
      h += `<section><h2>3. How long can he play?</h2><div class="long">${OPTS.map(([k, t, s]) => `<button type="button" class="opt" data-avail="${k}" aria-pressed="${st.avail === k}"><b>${t}</b><span>${s}</span></button>`).join('')}</div></section>`;
      h += `<button type="button" class="send" data-send ${st.kid && st.avail && !st.sending ? '' : 'disabled'}>${st.sending ? 'Sending…' : 'Send'}</button>`;
    }
  }
  app.innerHTML = h;
  app.querySelectorAll('[data-squad]').forEach(b => b.onclick = () => { st.squad = b.dataset.squad; st.kid = null; st.sent = null; try { localStorage.setItem('tt.parent.squad', st.squad); } catch (e) {} render(); });
  app.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => { st.kid = b.dataset.kid; render(); });
  app.querySelectorAll('[data-avail]').forEach(b => b.onclick = () => { st.avail = b.dataset.avail; render(); });
  const s = app.querySelector('[data-send]'); if (s) s.onclick = send;
  const a = app.querySelector('[data-again]'); if (a) a.onclick = () => { st.kid = null; st.avail = null; st.sent = null; render(); window.scrollTo(0, 0); };
}

async function send() {
  st.sending = true; st.error = ''; render();
  const body = JSON.stringify({ type: 'answer', kind: 'match', squad: st.squad, name: st.kid, answer: st.avail });
  try {
    const r = await fetch(API, { method: 'POST', body });
    const j = await r.json();
    if (!j.ok) throw new Error('not saved');
    const words = { full: 'down for the full game.', first: 'down for the first half (match 1).', second: 'down for the second half (match 2).', out: 'marked as can\u2019t play.' };
    st.sent = `${st.kid}\u2019s ${words[st.avail]}`;
  } catch (e) {
    st.error = 'That didn\u2019t go through. Check your signal and tap Send again.';
  }
  st.sending = false; render();
}

async function load() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    INFO = (await r.json()).info || {};
  } catch (e) {
    st.error = 'Couldn\u2019t load the squad lists. Check your signal and reload the page.';
  }
  render();
}
load();
</script>
</body>
</html>
